name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: bun run build:sdk

      - name: Build Freebuff binary
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "Building version: $VERSION"
          bun freebuff/cli/build.ts "$VERSION"

      - name: Smoke test Freebuff binary
        env:
          NEXT_PUBLIC_CB_ENVIRONMENT: prod
          NEXT_PUBLIC_CODEBUFF_APP_URL: https://codebuff.com
          NEXT_PUBLIC_SUPPORT_EMAIL: support@codebuff.com
          NEXT_PUBLIC_POSTHOG_API_KEY: phc_public_placeholder
          NEXT_PUBLIC_POSTHOG_HOST_URL: https://us.i.posthog.com
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          NEXT_PUBLIC_STRIPE_CUSTOMER_PORTAL: https://billing.stripe.com/p/login/test
          NEXT_PUBLIC_WEB_PORT: '3000'
        run: |
          chmod +x cli/bin/freebuff
          cli/bin/freebuff --version
          bun cli/scripts/smoke-binary.ts cli/bin/freebuff

      - name: Package artifact
        run: |
          mkdir -p dist/freebuff-linux-x64
          cp cli/bin/freebuff dist/freebuff-linux-x64/
          cp cli/bin/tree-sitter.wasm dist/freebuff-linux-x64/
          ls -la dist/freebuff-linux-x64/

      - uses: actions/upload-artifact@v4
        with:
          name: freebuff-linux-x64
          path: dist/freebuff-linux-x64/*
          retention-days: 90
